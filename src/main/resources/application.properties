spring.application.name=backend-application
# ==========================================
# FixMate Backend Configuration
# ==========================================

# ==========================================
# Server
# ==========================================
server.port=8080

# ==========================================
# MySQL Database
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/fixmate_db?useSSL=false&serverTimezone=Africa/Johannesburg&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=L@ngile2190

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Jackson
# ==========================================
spring.jackson.serialization.fail-on-empty-beans=false

# ==========================================
# File Uploads
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.com.fixmate=DEBUG